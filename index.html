<title>Control de carga</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14213d;--mu:#667085;--bd:#d9dde3;--pri:#1f3a5f;--gr:#546e7a;--grb:#eceff1;--g:#2e7d32;--gb:#e8f5e9;--a:#9a5b00;--ab:#fff3e0;--b:#1565c0;--bb:#e3f2fd;--r:#c62828;--rb:#ffebee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1520;--card:#18212f;--tx:#e8edf5;--mu:#9aa7b8;--bd:#2b3648;--pri:#4f7cc0;--gr:#b0bec5;--grb:#263238;--g:#81c784;--gb:#1b3a1f;--a:#ffb74d;--ab:#3e2c0d;--b:#64b5f6;--bb:#102a43;--r:#ef5350;--rb:#3c1618}}
:root[data-theme="dark"]{--bg:#0f1520;--card:#18212f;--tx:#e8edf5;--mu:#9aa7b8;--bd:#2b3648;--pri:#4f7cc0;--gr:#b0bec5;--grb:#263238;--g:#81c784;--gb:#1b3a1f;--a:#ffb74d;--ab:#3e2c0d;--b:#64b5f6;--bb:#102a43;--r:#ef5350;--rb:#3c1618}
*{box-sizing:border-box}html,body{margin:0}body{font:16px/1.35 -apple-system,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:760px;margin:auto;padding:12px 12px 96px}small{color:var(--mu)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}.rw{display:flex;justify-content:space-between;align-items:center;gap:10px}
.n{background:var(--grb);color:var(--gr)}.g{background:var(--gb);color:var(--g)}.a{background:var(--ab);color:var(--a)}.b{background:var(--bb);color:var(--b)}.r{background:var(--rb);color:var(--r)}
.p{display:inline-block;padding:2px 9px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap}
.gd{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.t{border-radius:12px;padding:12px}.t b{display:block;font-size:28px}.t span{font-size:13px;font-weight:600}
.in{display:block;width:100%;font-size:17px;padding:13px;border:1px solid var(--bd);border-radius:10px;margin:6px 0;background:var(--card);color:var(--tx);font-family:inherit}
.bt{display:block;width:100%;text-align:center;min-height:52px;font-size:17px;font-weight:700;border:0;border-radius:12px;background:var(--pri);color:#fff;margin:8px 0;padding:14px}.bt.s{background:var(--grb);color:var(--tx)}.bt:disabled{opacity:.4}
.bt.vz{background:var(--g);color:#fff;font-size:19px}.bt.vz.on{background:var(--r);animation:pl 1.1s infinite}@keyframes pl{50%{opacity:.6}}
.bn{padding:12px;border-radius:12px;font-weight:700;margin:8px 0}.bn.r{background:var(--r);color:#fff}.bn.a{border:1px solid var(--a)}
.pr{background:var(--r);color:#fff;text-align:center;padding:6px;font-weight:700;font-size:14px}
#nv{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
#nv button{border:0;background:none;padding:14px 2px;font-size:13px;color:var(--mu);font-weight:700}#nv .on{color:var(--pri);box-shadow:inset 0 3px var(--pri)}
.mo{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:9}#md2 .mo{z-index:10}
.sh{background:var(--card);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.nm{width:84px;font-size:18px;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}input[type=checkbox],input[type=radio]{width:26px;height:26px;margin-right:8px}
.rd label{display:flex;align-items:center;padding:8px 0}.ts{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:99px;z-index:20;max-width:92%;text-align:center}
s{opacity:.5}h3{margin:4px 0 8px}a.bt{text-decoration:none;display:flex;align-items:center;justify-content:center}u{text-decoration:underline;color:var(--pri);cursor:pointer}
pre.cp{white-space:pre-wrap;font:15px/1.4 -apple-system,Helvetica,Arial,sans-serif;background:var(--grb);border-radius:10px;padding:12px;margin:8px 0}
.ba{height:12px;border-radius:99px;background:var(--grb);overflow:hidden;margin:6px 0}.ba i{display:block;height:100%;background:var(--pri)}
.ac{display:flex;gap:8px;margin-top:10px}.ac .bt{margin:0;min-height:48px}.ac .w{flex:0 0 62px;font-size:20px}
.hd{cursor:pointer}.cl{margin:4px 0 10px 0;padding-left:10px;border-left:3px solid var(--bd)}
.fl{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px}.fl button{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:9px 14px;font-size:14px;font-weight:700}.fl button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
</style></head><body>
<div id="top"></div><main id="m"></main><nav id="nv"></nav><div id="md"></div><div id="md2"></div>
<script>
const VER='4 · 28-oct-2026';
const $=s=>document.querySelector(s),h=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
nz=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(),
sq=s=>nz(s).replace(/[^a-z0-9]/g,''),
hs=s=>{let x=5381;for(const c of s)x=(x*33^c.charCodeAt(0))>>>0;return x.toString(36)},
fd=t=>new Date(t).toLocaleString('es-CL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}),
mo=n=>'$'+Math.abs(n).toLocaleString('es-CL'),
pct=(a,b)=>b>0?Math.round(a*100/b):0;
// Pantalla: md = ventana abierta (mk: b bulto, f ficha, l liberar/pago, v dictado, rp reporte); hd/ig = botón "atrás"
let mode=localStorage.getItem('cc.mode')||'real',S,tab='c',q='',cur=null,md='',mk='',blk=false,fs='t',pf=[],busy=0,hd=0,ig=0,rpt='',exp={},
voz=localStorage.getItem('cc.voz')!='0',REC=null,vzOn=0,vlog=[];
const IDB=()=>new Promise((ok,no)=>{const r=indexedDB.open('cc-fotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}),
fput=async(k,v)=>{const d=await IDB();return new Promise((ok,no)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})},
fget=async k=>{try{const d=await IDB();return await new Promise(ok=>{const r=d.transaction('f').objectStore('f').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})}catch(e){return null}},
fall=async()=>{try{const d=await IDB();return await new Promise(ok=>{const o={},r=d.transaction('f').objectStore('f').openCursor();r.onsuccess=()=>{const c=r.result;if(c){o[c.key]=c.value;c.continue()}else ok(o)};r.onerror=()=>ok(o)})}catch(e){return{}}},
comp=f=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.65))};i.onerror=no;i.src=u});
// Voz hablada: confirma sin mirar la pantalla
function say(t){if(!voz)return;try{const S2=window.speechSynthesis;if(!S2)return;const u=new SpeechSynthesisUtterance(t);u.lang='es-CL';u.rate=1.08;S2.speak(u)}catch(e){}}
// Datos: cl clientes, bu bultos, mv movimientos, au autorizados, li liberaciones vigentes, lg registro, fk fotos respaldadas, op operador
const emp=()=>({v:'',cl:[],bu:[],mv:[],au:[],li:{},lg:[],fk:[],op:'',bk:0,bt:0,n:0});
function norm(s){s={...emp(),...s};
 ['cl','bu','mv','au','lg','fk'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[]});
 if(!s.li||typeof s.li!='object'||Array.isArray(s.li))s.li={};
 s.cl.forEach(c=>c.id=String(c.id));s.bu.forEach(b=>{b.id=String(b.id);b.c=String(b.c)});s.mv.forEach(m=>{m.b=String(m.b);if(m.c!=null)m.c=String(m.c)});
 // Respaldos de la versión 3: recepción pasa a "bajó al muelle", entrega a "despachado"
 s.mv.forEach(m=>{if(m.t=='r')m.t='m';else if(m.t=='e')m.t='d'});
 s.n=s.mv.reduce((a,m)=>Math.max(a,+m.id||0),+s.n||0);return s}
function test(){const s=emp();s.v='PRUEBA';
 [['gv','FERRETERIA GV PRUEBA',null,1],['a','PRUEBA A con deuda',100000,0],['b','PRUEBA B',null,0],['c','PRUEBA C saldo a favor',-5000,0]].forEach(([id,n,v,p])=>s.cl.push({id,n,e:'',rut:'',tel:'',mail:'',s:v,p}));
 const b=(i,c,d,q,tp)=>s.bu.push({id:'T|'+i,i,c,d,tp:tp||'Cajón',q:q||1});
 for(let i=1;i<=40;i++)b('GV '+(45660000+i*137),'gv','CAJON FERRETERIA '+i);
 for(let i=1;i<=7;i++)b('JP 0'+i,'a','ENCARGO JUAN PRUEBA '+i);
 for(let i=1;i<=5;i++)b('CE '+(20+i*5),'b','BULTO CAMILO PRUEBA '+i);
 b('VH 7701','c','CAMIONETA PRUEBA',1,'Vehículo');s.bu[s.bu.length-1].pat='ABCD12';
 b('BB 3301','c','BIG BAG PRUEBA',3,'Big bag');return s}
function load(){blk=false;let raw=localStorage.getItem('cc.'+mode);S=null;
 if(raw){try{S=norm(JSON.parse(raw))}catch(e){blk=true;alert('Los datos guardados no se pueden leer. No se guardará nada nuevo: restaura un respaldo en Más.')}}
 if(!S)S=mode=='prueba'?test():emp()}
function save(){if(blk)return alert('Datos ilegibles: restaura un respaldo antes de continuar.');try{localStorage.setItem('cc.'+mode,JSON.stringify(S))}catch(e){alert('No se pudo guardar. Haz un respaldo ahora.')}}
function prevSave(){try{localStorage.setItem('cc.'+mode+'.prev',JSON.stringify(S))}catch(e){}}
const U=()=>S.op?{u:S.op}:{};
// m = bajó al muelle, d = despachado, x = daño, a = anulación.
// Despachar implica haber bajado: bajados = max(m,d). Así nunca hace falta marcar el paso intermedio.
function calc(){const an=new Set(),M={},C=new Map(S.cl.map(c=>[c.id,c]));
 S.mv.forEach(m=>{if(m.t=='a')an.add(m.ref)});S.bu.forEach(b=>M[b.id]={m:0,d:0,dmg:[],f:[]});
 S.mv.forEach(v=>{if(v.t=='a'||an.has(v.id)||!M[v.b])return;const x=M[v.b];
  if(v.f)x.f.push(...v.f);
  if(v.t=='m')x.m+=v.n;else if(v.t=='d')x.d+=v.n;else if(v.t=='x')x.dmg.push(v)});
 S.bu.forEach(b=>{const x=M[b.id];x.baj=Math.max(x.m,x.d);x.mue=x.baj-x.d;x.pen=Math.max(b.q-x.baj,0)});
 return{M,C,an}}
const deu=c=>c&&(c.s>0||c.k),libOk=c=>{const l=S.li[c.id];return !!l&&l.s===(c.s??null)};
function db(c){if(deu(c))return libOk(c)?['Deuda liberada','a']:['DEUDA '+(c.s>0?mo(c.s):'por confirmar pago'),'r'];
 if(c.vf)return['Sin registro: verificar','a'];if(c.s<0)return['Saldo a favor '+mo(c.s),'b'];return['Sin deuda','g']}
function st(b,x){if(x.d>=b.q)return['Despachado','b'];if(x.baj<=0)return['En barco','n'];
 if(x.d>0)return['Despachado '+x.d+'/'+b.q,'b'];if(x.baj>=b.q)return['En muelle','g'];return['Muelle '+x.baj+'/'+b.q,'a']}
const P=(t,c)=>`<span class="p ${c}">${h(t)}</span>`;
const CP=f=>f&&f.length?`<button class="bt s" style="min-height:36px;width:auto;display:inline-block;padding:6px 14px;margin:6px 0" data-a="fo" data-i="${f.join(',')}">📷 ${f.length}</button>`:'',
CLIP=()=>'<div class="gd"><label class="bt s">📷 Tomar foto<input type="file" accept="image/*" capture="environment" hidden data-f="ph"></label><label class="bt s">📎 Adjuntar<input type="file" accept="image/*" multiple hidden data-f="ph"></label></div><div id="th"></div>',
TH=()=>{const e=$('#th');if(e)e.innerHTML=pf.map((s,i)=>`<span style="position:relative;display:inline-block;margin:4px"><img src="${s}" style="width:72px;height:72px;object-fit:cover;border-radius:8px"><b data-a="rf" data-i="${i}" style="position:absolute;top:-6px;right:-6px;background:var(--r);color:#fff;border-radius:99px;width:26px;height:26px;text-align:center;line-height:26px">×</b></span>`).join('')};
async function ph(t){for(const f of t.files){try{pf.push(await comp(f))}catch(e){alert('No se pudo leer una de las fotos.')}}t.value='';TH()}
async function sv(){const ks=[];for(const s of pf){const k=mode+'|'+Date.now()+'-'+Math.random().toString(36).slice(2,6);await fput(k,s);ks.push(k)}return ks}

/* ---------- Agrupación para el avance ----------
   El cliente marcado p=1 en el paquete va como grupo propio. Si no hay ninguno marcado,
   se toma como principal a quien traiga 25% o más de los bultos del viaje. */
function grupos(){const{M,C}=calc();const T={};let tot=0;
 S.bu.forEach(b=>{const x=M[b.id],g=T[b.c]??={c:C.get(b.c)||{n:'(sin cliente)',id:b.c},q:0,baj:0,mue:0,d:0,dmg:0,bu:[]};
  g.q+=b.q;g.baj+=x.baj;g.mue+=x.mue;g.d+=x.d;g.dmg+=x.dmg.length;g.bu.push(b);tot+=b.q});
 const L=Object.values(T);const marc=L.some(g=>g.c.p);
 L.forEach(g=>g.pri=marc?!!g.c.p:(tot>0&&g.q/tot>=.25));
 L.sort((a,b)=>(b.pri-a.pri)||(b.q-a.q)||String(a.c.n).localeCompare(String(b.c.n)));
 return{L,tot,baj:L.reduce((a,g)=>a+g.baj,0),mue:L.reduce((a,g)=>a+g.mue,0),des:L.reduce((a,g)=>a+g.d,0)}}

/* ---------- Dictado ----------
   Convierte "7890 bajó, 7723 y 7725 despachados" en movimientos.
   Nunca adivina: si un código calza con dos bultos, lo deja pendiente y lo dice. */
const NW={cero:0,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9};
function vparse(txt){
 let t=nz(txt).replace(/[.,;:\n]+/g,' , ').replace(/\s+/g,' ');
 t=t.split(' ').map(w=>NW[w]!==undefined?String(NW[w]):w).join(' ');
 t=t.replace(/\b\d(?: \d)+\b/g,s=>s.replace(/ /g,''));
 const segs=t.split(' , ').map(s=>s.trim()).filter(Boolean),out=[];
 segs.forEach(s=>{
  const ac=/despach|salio|sale|salieron|camion|porteria|afuera/.test(s)?'d':/bajo|bajaron|abajo|muelle|descarg|llego|llegaron/.test(s)?'m':null;
  const cods=(s.match(/[a-z]*\d{2,}[a-z0-9]*/g)||[]).filter(c=>!/^(19|20)\d\d$/.test(c)||true);
  cods.forEach(c=>out.push({cod:c,t:ac||'m',auto:!ac}))});
 return out}
function vmatch(cod,t){const{M}=calc(),k=sq(cod);
 let a=S.bu.filter(b=>sq(b.i).includes(k));
 if(a.length>1){const ex=a.filter(b=>sq(b.i)==k);if(ex.length==1)a=ex}
 if(a.length>1){const vv=a.filter(b=>t=='d'?M[b.id].d<b.q:M[b.id].baj<b.q);if(vv.length==1)a=vv}
 return a}
async function vaplica(txt){const it=vparse(txt);if(!it.length){say('No entendí ningún código');return toast('No se reconoció ningún código.')}
 const{M,C}=calc();let ok=0;const malos=[],dudas=[],blo=[];const ts=Date.now();
 for(const{cod,t,auto}of it){
  const a=vmatch(cod,t);
  if(!a.length){malos.push(cod);continue}
  if(a.length>1){dudas.push(cod);continue}
  const b=a[0],x=M[b.id],c=C.get(b.c);
  if(t=='d'&&deu(c)&&!libOk(c)){blo.push(b.i);continue}
  const disp=t=='d'?b.q-x.d:b.q-x.baj;
  if(disp<=0){vlog.unshift({ok:0,txt:b.i+' ya estaba '+(t=='d'?'despachado':'abajo')});continue}
  S.mv.push({id:++S.n,t,b:b.id,n:disp,...(t=='d'?{c:b.c}:{}),...U(),ts,vz:1});
  x[t]+=disp;x.baj=Math.max(x.m,x.d);x.mue=x.baj-x.d;ok++;
  vlog.unshift({ok:1,txt:b.i+' · '+(t=='d'?'despachado':'en muelle')+(auto?' (sin palabra, asumido «bajó»)':'')+' · '+((C.get(b.c)||{}).n||'')})}
 if(ok)save();
 malos.forEach(c=>vlog.unshift({ok:0,txt:'No encontrado: '+c}));
 dudas.forEach(c=>vlog.unshift({ok:0,txt:'Calza con varios bultos: '+c}));
 blo.forEach(c=>vlog.unshift({ok:0,txt:'Bloqueado por deuda: '+c}));
 vlog=vlog.slice(0,40);
 const g=grupos();let d=ok+' registrado'+(ok==1?'':'s');
 if(malos.length)d+='. '+malos.length+' no encontrado'+(malos.length==1?'':'s')+': '+malos.join(', ');
 if(dudas.length)d+='. '+dudas.length+' con duda';
 if(blo.length)d+='. '+blo.length+' bloqueado por deuda';
 d+='. Avance '+pct(g.baj,g.tot)+' por ciento';
 say(d);R();toast(ok+' registrados'+(malos.length||dudas.length||blo.length?' · revisa los avisos':''))}
function vzStart(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR)return alert('Este equipo no permite escuchar en continuo desde la app. Usa el cuadro de texto de abajo y el micrófono del teclado: ese funciona siempre, incluso sin señal.');
 if(vzOn)return vzStop();
 try{REC=new SR();REC.lang='es-CL';REC.continuous=true;REC.interimResults=false;
  REC.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript+' , ';
   const e2=$('#vt');if(e2){e2.value=(e2.value+' , '+t).trim();}vaplica(t)};
  REC.onerror=ev=>{vzOn=0;RM();if(ev.error=='not-allowed')alert('El micrófono está bloqueado para esta app. Actívalo en los ajustes del navegador.');
   else if(ev.error=='network')alert('Escuchar en continuo necesita señal y ahora no hay. Usa el cuadro de texto con el micrófono del teclado.')};
  REC.onend=()=>{if(vzOn){try{REC.start()}catch(e){vzOn=0;RM()}}else RM()};
  REC.start();vzOn=1;RM();say('Escuchando')}catch(e){vzOn=0;alert('No se pudo abrir el micrófono.')}}
function vzStop(){vzOn=0;try{if(REC)REC.stop()}catch(e){}RM()}

/* ---------- Pantallas ---------- */
const V={
c(){const{M}=calc();let b1=0,b2=0,b3=0,dm=0;
 S.bu.forEach(b=>{const x=M[b.id];if(x.pen>0)b1++;if(x.mue>0)b2++;if(x.d>=b.q)b3++;if(x.dmg.length)dm++});
 const g=grupos();
 return `<div class="c"><div class="rw"><b>Avance de descarga</b><b style="font-size:22px">${pct(g.baj,g.tot)}%</b></div><div class="ba"><i style="width:${pct(g.baj,g.tot)}%"></i></div>
 <small>${g.baj} de ${g.tot} bultos bajados · ${g.mue} en muelle · ${g.des} despachados</small></div>
 <button class="bt vz" data-a="vz">🎙️ Dictar lo que baja</button>
 <input id="q" class="in" placeholder="Código, cliente o descripción — basta el final (7890)" value="${h(q)}" autocomplete="off" enterkeyhint="search">

 const r1=[row(['Viaje','Cliente','Entidad','RUT','Referencia','Descripción','Tipo','Patente','Manifestado','Bajados','En muelle','Despachados','Aún en barco','Daños','Detalle del daño','Deuda del cliente'])]
  .concat(S.bu.map(b=>{const x=M[b.id],c=C.get(b.c)||{};return row([S.v,c.n,c.e,c.rut,b.i,b.d,b.tp,b.pat,b.q,x.baj,x.mue,x.d,x.pen,x.dmg.length,x.dmg.map(m=>m.x).join(' | '),c.n?db(c)[0]:''])}));
 const r2=[row(['Fecha','Tipo','Referencia','Descripción','Cliente','Cantidad','Detalle','Registró','Dictado','Anulada'])]
  .concat(S.mv.map(m=>{const b=Bm.get(m.b)||{},c=C.get(m.c||b.c)||{};return row([new Date(m.ts).toLocaleString('es-CL'),{m:'Bajó al muelle',d:'Despachado',x:'Daño',a:'Anulación'}[m.t],b.i,b.d,c.n,m.t=='a'||m.t=='x'?'':m.n,m.x,m.u,m.vz?'Sí':'',m.t!='a'&&an.has(m.id)?'Sí':''])}));
 if(await out([[BOM+r1.join('\r\n'),'bultos-'+vv+'-'+t+'.csv','text/csv'],[BOM+r2.join('\r\n'),'movimientos-'+vv+'-'+t+'.csv','text/csv']]))toast('Archivos generados')},
async cierre(){if(mode!='real')return;if(!S.bu.length)return alert('No hay datos que cerrar.');const g=grupos();
 if(!confirm('CERRAR VIAJE '+(S.v||'')+'\n\nAvance '+pct(g.baj,g.tot)+'%. Quedan '+(g.tot-g.baj)+' bultos en el barco y '+g.mue+' en el muelle sin despachar.\n\nSe generan un respaldo completo y un Excel (CSV) y luego la app queda vacía para el próximo viaje. Se mantienen las personas autorizadas y el operador.\n\n¿Continuar?'))return;
 const B=await mkBk();if(!await out(B.fs))return;
 if(!confirm('¿Guardaste los archivos en un lugar seguro (Archivos, iCloud, correo)?\n\nAl aceptar se vacía el viaje actual. Podrás deshacerlo desde Más → «Recuperar copia anterior» hasta la próxima importación.'))return;
 prevSave();S=norm({au:S.au,op:S.op,fk:B.fk});save();tab='c';cur=null;md='';mk='';exp={};$('#md2').innerHTML='';R();toast('Viaje cerrado. Importa el siguiente.')},
prev(){const raw=localStorage.getItem('cc.'+mode+'.prev');if(!raw)return;if(!confirm('¿Volver a la copia anterior? Lo registrado desde entonces se perderá (la situación actual quedará guardada por si te arrepientes).'))return;
 try{const Pv=norm(JSON.parse(raw)),now=JSON.stringify(S);localStorage.setItem('cc.'+mode+'.prev',now);S=Pv;blk=false;save();R();toast('Copia anterior recuperada')}catch(e){alert('No se pudo recuperar la copia.')}},
async upd(){if(!navigator.onLine)return alert('Sin conexión: no se puede buscar una actualización. La app sigue funcionando.');
 try{const r=await fetch('index.html',{cache:'no-store'});if(!r.ok)throw 0;for(const k of await caches.keys()){if(k.startsWith('cc-')){const c=await caches.open(k);await c.put('index.html',r.clone());await c.put('./',r.clone())}}const g=await navigator.serviceWorker.getRegistration();if(g)await g.update();location.reload()}catch(e){alert('No se pudo actualizar. La app sigue funcionando con la versión actual.')}},
aa(){const n=$('#an').value.trim(),p=$('#ap').value;if(!n||p.length<4)return alert('Nombre y PIN de 4 o más caracteres.');S.au.push({n,p:hs(p)});save();R()},
mode(){mode=mode=='prueba'?'real':'prueba';localStorage.setItem('cc.mode',mode);load();tab='c';cur=null;md='';mk='';pf=[];exp={};$('#md2').innerHTML='';R()},
rst(){if(confirm('¿Borrar los datos de prueba y empezar de nuevo?')){S=test();save();R()}}};

const part=i=>{const k=String(i).lastIndexOf('|');return[String(i).slice(0,k),String(i).slice(k+1)]};
function mov(id,t,n,keep){const b=S.bu.find(b=>b.id==id);if(!b)return;const{M,C}=calc(),x=M[id],c=C.get(b.c);
 if(t=='d'&&deu(c)&&!libOk(c))return alert('Despacho bloqueado por deuda de '+(c.n||'')+'.');
 const disp=t=='d'?b.q-x.d:b.q-x.baj;
 if(disp<=0)return toast(t=='d'?'Ya estaba todo despachado.':'Ya estaba todo abajo.');
 if(n>disp)n=disp;
 S.mv.push({id:++S.n,t,b:id,n,...(t=='d'?{c:b.c}:{}),...U(),ts:Date.now()});save();
 const g=grupos();const txt=b.i+' '+(t=='d'?'despachado':'en muelle');
 say(txt+'. '+(c&&c.n?c.n+'. ':'')+'Avance '+pct(g.baj,g.tot)+' por ciento');
 if(keep){md=mdB(id)}else{md='';mk='';cur=null}
 R();toast(txt)}
function cp(t){if(!t)return;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Texto copiado'),()=>alert('No se pudo copiar.'));else alert('Este equipo no permite copiar desde aquí.')}
function IMP(D){if(!D.clientes||!D.bultos)throw 0;
 if(S.v&&D.viaje&&String(D.viaje)!=String(S.v)&&!confirm('Este paquete es del viaje '+D.viaje+' y la app tiene datos del viaje '+S.v+'.\nSi el viaje anterior ya terminó, conviene usar «Cerrar viaje» en Más.\n\n¿Importar igual y mezclarlo con lo actual?'))return;
 D.clientes.forEach(c=>c.id=String(c.id));D.bultos.forEach(b=>{b.id=String(b.id);b.c=String(b.c)});
 prevSave();const{M}=calc(),C=new Map(S.cl.map(c=>[c.id,c])),B=new Map(S.bu.map(b=>[b.id,b]));let na=0,nu=0,nk=0;
 D.clientes.forEach(c=>{const o=C.get(c.id);if(o){const pv=o.s??null;Object.assign(o,c);if(pv>0&&!(c.s>0))o.k=1}else S.cl.push(c)});
 D.bultos.forEach(b=>{const o=B.get(b.id);if(!o){S.bu.push(b);na++}else if(!M[b.id]||(M[b.id].baj==0&&M[b.id].d==0)){Object.assign(o,b);nu++}else nk++});
 if(!S.v)S.v=D.viaje;save();R();alert(`Importado: ${na} bultos nuevos, ${nu} actualizados, ${nk} con movimientos (no se tocaron).`)}
async function RES(D){if(!D.bu||!D.mv)throw 0;
 if(mode=='real'&&D.v=='PRUEBA')return alert('Ese respaldo es de datos de PRUEBA y estás en datos reales. No se restauró nada.');
 if(mode=='prueba'&&D.v!='PRUEBA')return alert('Ese respaldo es de datos reales y estás en modo prueba. No se restauró nada.');
 if(!confirm('Esto reemplaza TODOS los datos actuales por el respaldo. ¿Continuar?'))return;
 const Q=D._f||{};delete D._f;delete D._t;for(const k in Q)await fput(k,Q[k]);prevSave();S=norm(D);blk=false;save();R();toast('Respaldo restaurado')}
async function FILE(t){if(t.dataset.f=='ph')return ph(t);const fs2=[...t.files];t.value='';if(!fs2.length)return;
 try{if(t.dataset.f=='imp')return IMP(JSON.parse(await fs2[0].text()));
  const Ds=[];for(const f of fs2)Ds.push(JSON.parse(await f.text()));let np=0;
  for(const D of Ds)if(D._t=='fotos'&&D._f)for(const k in D._f){await fput(k,D._f[k]);np++}
  const dd=Ds.filter(D=>D._t!='fotos');if(dd.length>1)return alert('Elige un solo archivo de datos (los de fotos pueden ser varios).');
  if(dd.length)await RES(dd[0]);if(np)toast(np+' fotos restauradas')}catch(e){alert('Archivo no válido.')}}
function toast(t){const d=document.createElement('div');d.className='ts';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2200)}

addEventListener('popstate',()=>{if(ig>0){ig--;if(!ig)syncH();return}hd=Math.max(0,hd-1);
 if($('#md2').innerHTML){$('#md2').innerHTML='';syncH()}else if(md){clM();RM()}else syncH()});

 $('#nv').innerHTML=[['c','Carga'],['a','Avance'],['d','Daños'],['m','Más']].map(([k,l])=>`<button data-a="tab" data-i="${k}" class="${tab==k?'on':''}">${l}</button>`).join('');
 $('#m').innerHTML=V[tab]();$('#md').innerHTML=md;L();TH();syncH()}
